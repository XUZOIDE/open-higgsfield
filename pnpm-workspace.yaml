allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
# The committed lockfile pins these official packages at versions published
# hours before pnpm's minimum-release-age cutoff; exempt just those names.
minimumReleaseAgeExclude:
  - "@rollup/*"
  - rollup
  - next
  - "@next/*"
overrides:
  esbuild: 0.28.1
